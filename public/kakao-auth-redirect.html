<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyNet Kakao Login</title>
    <style>
      body {
        align-items: center;
        background: #f8fafc;
        color: #111827;
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
      }

      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>StudyNet으로 돌아가는 중</h1>
      <p>자동으로 이동하지 않으면 <a id="fallback" href="studynet://oauth/kakao">여기를 눌러주세요.</a></p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search || window.location.hash.slice(1));
      const target = new URL("studynet://oauth/kakao");

      params.forEach((value, key) => {
        target.searchParams.append(key, value);
      });

      document.getElementById("fallback").href = target.toString();
      window.location.replace(target.toString());
    </script>
  </body>
</html>
